    <text x="474" y="130" fill="#455d54" font-size="14" font-weight="400" text-anchor="start">各阶段的耗时</text>
    <path d="M 542 155 V 193" fill="none" stroke="#455d54" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
