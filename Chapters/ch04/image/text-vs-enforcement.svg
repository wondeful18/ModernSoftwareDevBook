<svg xmlns="http://www.w3.org/2000/svg" width="880" height="379" viewBox="0 0 880 379" role="img" aria-labelledby="title summary">
  <title id="title">文字约定和执行规则提供的证据</title>
  <desc id="summary">可以让指令指向同一条可执行检查</desc>
