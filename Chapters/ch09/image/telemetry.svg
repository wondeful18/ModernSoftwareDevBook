    <text x="269" y="110" fill="#253833" font-size="17" font-weight="700" text-anchor="start">指标</text>
    <text x="269" y="130" fill="#455d54" font-size="14" font-weight="400" text-anchor="start">数量、时延与失败率</text>
    <path d="M 337 155 V 193" fill="none" stroke="#455d54" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
