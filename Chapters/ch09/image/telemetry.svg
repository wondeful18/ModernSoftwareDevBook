    <path d="M 132 155 V 193" fill="none" stroke="#455d54" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="255" y="85" width="168" height="70" rx="12" fill="#394c3e" opacity=".10"/>
