<svg xmlns="http://www.w3.org/2000/svg" width="880" height="379" viewBox="0 0 880 379" role="img" aria-labelledby="title summary">
  <title id="title">工作约定和执行方式放在哪里</title>
  <desc id="summary">同一项验收条件尽量维护在一个权威位置</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1 L8 5 L1 9" fill="none" stroke="#455d54" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="878" height="377" rx="18" fill="#fcfaf2" stroke="#d2d9cf" stroke-width="2"/>
  <g font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, sans-serif">
    <text x="40" y="46" fill="#253833" font-size="25" font-weight="700" text-anchor="start">工作约定和执行方式放在哪里</text>
    <text x="838" y="43" fill="#455d54" font-size="13" font-weight="700" text-anchor="end">CS146S  /  03</text>
