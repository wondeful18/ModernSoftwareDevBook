    <path d="M 440 77 V 318" fill="none" stroke="#9cae9f" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 5"/>
    <rect x="47" y="83" width="375" height="62" rx="12" fill="#394c3e" opacity=".10"/>
    <rect x="45" y="80" width="375" height="62" rx="12" fill="#f6e8b7" stroke="#455d54" stroke-width="1.35"/>
    <text x="61" y="108" fill="#253833" font-size="17" font-weight="700" text-anchor="start">约定与做法</text>
    <text x="61" y="128" fill="#455d54" font-size="14" font-weight="400" text-anchor="start">向执行者交接上下文</text>
    <rect x="462" y="83" width="375" height="62" rx="12" fill="#394c3e" opacity=".10"/>
    <rect x="460" y="80" width="375" height="62" rx="12" fill="#e0e9f3" stroke="#455d54" stroke-width="1.35"/>
    <text x="476" y="108" fill="#253833" font-size="17" font-weight="700" text-anchor="start">工具与门禁</text>
    <text x="476" y="128" fill="#455d54" font-size="14" font-weight="400" text-anchor="start">向系统交接可验证能力</text>
    <rect x="47" y="160" width="375" height="62" rx="12" fill="#394c3e" opacity=".10"/>
    <rect x="45" y="157" width="375" height="62" rx="12" fill="#f6e8b7" stroke="#455d54" stroke-width="1.35"/>
    <text x="61" y="185" fill="#253833" font-size="17" font-weight="700" text-anchor="start">仓库指令</text>
    <text x="61" y="205" fill="#455d54" font-size="14" font-weight="400" text-anchor="start">每次工作要遵循的约定</text>
    <rect x="462" y="160" width="375" height="62" rx="12" fill="#394c3e" opacity=".10"/>
    <rect x="460" y="157" width="375" height="62" rx="12" fill="#e0e9f3" stroke="#455d54" stroke-width="1.35"/>
    <text x="476" y="185" fill="#253833" font-size="17" font-weight="700" text-anchor="start">CLI 或 MCP</text>
    <text x="476" y="205" fill="#455d54" font-size="14" font-weight="400" text-anchor="start">可重复调用的能力</text>
    <rect x="47" y="237" width="375" height="62" rx="12" fill="#394c3e" opacity=".10"/>
    <rect x="45" y="234" width="375" height="62" rx="12" fill="#f6e8b7" stroke="#455d54" stroke-width="1.35"/>
    <text x="61" y="262" fill="#253833" font-size="17" font-weight="700" text-anchor="start">Skill</text>
    <text x="61" y="282" fill="#455d54" font-size="14" font-weight="400" text-anchor="start">任务匹配时载入的流程</text>
    <rect x="462" y="237" width="375" height="62" rx="12" fill="#394c3e" opacity=".10"/>
    <rect x="460" y="234" width="375" height="62" rx="12" fill="#e0e9f3" stroke="#455d54" stroke-width="1.35"/>
    <text x="476" y="262" fill="#253833" font-size="17" font-weight="700" text-anchor="start">测试或 CI</text>
