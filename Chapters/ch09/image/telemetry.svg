    <path d="M 747 155 V 193" fill="none" stroke="#455d54" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 132 193 H 747" fill="none" stroke="#455d54" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 440 193 V 216" fill="none" stroke="#455d54" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <rect x="272" y="227" width="340" height="74" rx="12" fill="#394c3e" opacity=".10"/>
    <rect x="270" y="224" width="340" height="74" rx="12" fill="#e9e4f1" stroke="#455d54" stroke-width="1.35"/>
