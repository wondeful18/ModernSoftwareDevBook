<svg xmlns="http://www.w3.org/2000/svg" width="880" height="378" viewBox="0 0 880 378" role="img" aria-labelledby="title summary">
  <title id="title">一条 CLI 命令的三条回执</title>
  <desc id="summary">单独核对 stdout、stderr 和退出码</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1 L8 5 L1 9" fill="none" stroke="#455d54" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="878" height="376" rx="18" fill="#fcfaf2" stroke="#d2d9cf" stroke-width="2"/>
  <g font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, sans-serif">
    <text x="40" y="46" fill="#253833" font-size="25" font-weight="700" text-anchor="start">一条 CLI 命令的三条回执</text>
    <text x="838" y="43" fill="#455d54" font-size="13" font-weight="700" text-anchor="end">CS146S  /  03</text>
    <path d="M 40 63 Q 198 61 338 64 T 839 63" fill="none" stroke="#cbd3c8" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 331 180 H 425" fill="none" stroke="#455d54" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 425 180 V 110 H 535" fill="none" stroke="#455d54" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <path d="M 425 180 H 535" fill="none" stroke="#455d54" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <path d="M 425 180 V 250 H 535" fill="none" stroke="#455d54" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <rect x="52" y="145" width="275" height="76" rx="12" fill="#394c3e" opacity=".10"/>
    <rect x="50" y="142" width="275" height="76" rx="12" fill="#f6e8b7" stroke="#455d54" stroke-width="1.35"/>
    <text x="66" y="170" fill="#253833" font-size="17" font-weight="700" text-anchor="start">命令输入</text>
    <text x="66" y="190" fill="#455d54" font-size="14" font-weight="400" text-anchor="start">list --status open</text>
    <rect x="546" y="84" width="287" height="58" rx="12" fill="#394c3e" opacity=".10"/>
    <rect x="544" y="81" width="287" height="58" rx="12" fill="#dcece2" stroke="#455d54" stroke-width="1.35"/>
    <text x="560" y="109" fill="#253833" font-size="17" font-weight="700" text-anchor="start">stdout</text>
    <text x="560" y="129" fill="#455d54" font-size="14" font-weight="400" text-anchor="start">符合规格的输出或空结果</text>
    <rect x="546" y="154" width="287" height="58" rx="12" fill="#394c3e" opacity=".10"/>
    <rect x="544" y="151" width="287" height="58" rx="12" fill="#e0e9f3" stroke="#455d54" stroke-width="1.35"/>
    <text x="560" y="179" fill="#253833" font-size="17" font-weight="700" text-anchor="start">stderr</text>
    <text x="560" y="199" fill="#455d54" font-size="14" font-weight="400" text-anchor="start">诊断或空输出</text>
    <rect x="546" y="224" width="287" height="58" rx="12" fill="#394c3e" opacity=".10"/>
    <rect x="544" y="221" width="287" height="58" rx="12" fill="#f1e1d8" stroke="#455d54" stroke-width="1.35"/>
    <text x="560" y="249" fill="#253833" font-size="17" font-weight="700" text-anchor="start">退出码</text>
    <text x="560" y="269" fill="#455d54" font-size="14" font-weight="400" text-anchor="start">成功为 0，参数错误为 2</text>
    <rect x="40" y="336" width="800" height="26" rx="7" fill="#ecefe4"/>
    <text x="54" y="354" fill="#455d54" font-size="14" font-weight="500" text-anchor="start">单独核对 stdout、stderr 和退出码</text>
  </g>
</svg>
